[project]
name = "pokedex-reader"
version = "0.1.0"
description = "A Pokédex-themed e-ink book reader"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
sim = ["pygame>=2.1.3"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pokedex_reader"]
